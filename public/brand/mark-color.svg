<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TokuPrice Henshin Dial">
  <title>TokuPrice Henshin Dial</title>
  <!-- Mechanical Bezel Outer Ring -->
  <circle cx="32" cy="32" r="26" stroke="#0f172a" stroke-width="3.5" fill="none"/>
  <!-- Bezel Tick Marks at 12, 3, 6, 9 o'clock -->
  <line x1="32" y1="6" x2="32" y2="10" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="54" x2="32" y2="58" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="6" y1="32" x2="10" y2="32" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="54" y1="32" x2="58" y2="32" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Transformation Price Index Ascending Curve -->
  <path d="M 16 44 C 22 44 26 38 32 32 L 48 16" stroke="#d9480f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Energy Core Center Node -->
  <circle cx="32" cy="32" r="3.5" fill="#d9480f"/>
  <circle cx="32" cy="32" r="1.5" fill="#ffffff"/>
  <!-- Apex Diamond-Faceted Data Spark -->
